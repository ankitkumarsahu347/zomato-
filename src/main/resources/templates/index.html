<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zomato - Discover food</title><style>body{font-family:Arial;margin:0;background:#f8f8f8;color:#222}.hero{background:#d9234f;color:white;padding:55px 8%;text-align:center}.hero h1{font-size:46px;margin:0 0 10px}.search{margin:25px auto;max-width:650px;background:white;padding:12px;border-radius:8px;color:#777}.nav{background:white;padding:18px 8%;text-align:right}.nav a{margin-left:20px;text-decoration:none;color:#d9234f}.container{padding:30px 8%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}.card{background:white;border-radius:12px;padding:22px;box-shadow:0 2px 10px #ddd}.rating{display:inline-block;background:#16833b;color:white;padding:5px 8px;border-radius:5px}.btn{display:inline-block;background:#d9234f;color:white;padding:10px 16px;border-radius:6px;text-decoration:none;margin-top:12px}</style></head><body><div class="nav"><a href="/">Home</a><a href="/login">Login</a></div><section class="hero"><h1>zomato</h1><p>Discover the best food & restaurants near you</p><div class="search">Search for restaurant, cuisine or dish</div></section><div class="container"><h2>Popular restaurants</h2><div class="grid"><div class="card" th:each="r : ${restaurants}"><h3 th:text="${r.name}">Restaurant</h3><p th:text="${r.cuisine}">Indian</p><p th:text="${r.city}">Bhopal</p><span class="rating" th:text="${r.rating + ' ★'}">4.5 ★</span><br><a class="btn" th:href="@{/restaurant(id=${r.restaurantId})}">View Menu</a></div></div></div></body></html>
