<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Your Cart</title><style>body{font-family:Arial;background:#f8f8f8}.box{max-width:700px;margin:40px auto;background:white;padding:25px;border-radius:12px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:15px 0}.total{font-size:22px;font-weight:bold}.btn{padding:11px 18px;background:#d9234f;color:white;border:0;border-radius:6px}</style></head><body><div class="box"><h1>Your Cart</h1><div th:if="${#lists.isEmpty(cart)}"><p>Your cart is empty.</p><a href="/">Find food</a></div><div th:each="item : ${cart}" class="row"><span th:text="${item.name + ' × ' + item.quantity}">Food × 1</span><span th:text="${'₹' + (item.price * item.quantity)}">₹100</span></div><div th:if="${!#lists.isEmpty(cart)}"><p class="total" th:text="${'Total: ₹' + total}">Total: ₹100</p><form action="/cart/clear" method="post"><button class="btn">Clear Cart</button></form></div><p><a href="/">← Continue shopping</a></p></div></body></html>
