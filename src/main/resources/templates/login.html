<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Zomato Login</title><style>body{font-family:Arial;background:#f8f8f8}.box{max-width:420px;margin:50px auto;background:white;padding:30px;border-radius:12px;box-shadow:0 2px 12px #ddd}input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{width:100%;padding:12px;background:#d9234f;color:white;border:0;border-radius:6px;margin-top:8px}.msg{color:#d9234f}</style></head><body><div class="box"><h1>Login</h1><p class="msg" th:text="${message}"></p><form action="/login" method="post"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form><hr><h2>Create account</h2><form action="/register" method="post"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Register</button></form><p><a href="/">Back to home</a></p></div></body></html>
