<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Restaurant Menu</title><style>body{font-family:Arial;background:#f8f8f8;margin:0}.head{background:#d9234f;color:white;padding:30px 8%}.container{padding:30px 8%}.item{background:white;margin:14px 0;padding:20px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.price{font-weight:bold}.btn{background:#d9234f;color:white;border:0;padding:10px 14px;border-radius:5px}</style></head><body><div class="head"><h1 th:text="${restaurant.name}">Restaurant</h1><p th:text="${restaurant.cuisine + ' • ' + restaurant.city + ' • ' + restaurant.rating + ' ★'}"></p></div><div class="container"><h2>Menu</h2><div class="item" th:each="food : ${foods}"><div><h3 th:text="${food.name}">Food</h3><p th:text="${food.description}">Description</p><span class="price" th:text="${'₹' + food.price}">₹100</span></div><form action="/cart/add" method="post"><input type="hidden" name="foodId" th:value="${food.foodId}"><input type="hidden" name="restaurantId" th:value="${food.restaurantId}"><input type="hidden" name="name" th:value="${food.name}"><input type="hidden" name="price" th:value="${food.price}"><button class="btn">Add to Cart</button></form></div><p><a href="/">← Back</a> | <a href="/cart">View Cart</a></p></div></body></html>
